name: CI

on:
  push:
    branches:
      - master
      - develop
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - master
      - develop8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} 
  cancel-in-progress: true

jobs:
  #JOB - 1 -- VALIDAR
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend
    
    steps:
      #Trae el repositorio a la vm del runner de github actions
      - name: Checkout
        uses: actions/checkout@v4
      #Configura pnpm para manejar las dependencias del proyecto
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      #Configura Node y cachea las dependencias para acelerar futuras ejecuciones
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      #Instala las dependencias del proyecto, solo si el lockfile no ha cambiado para asegurar consistencia
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Obtener el Tag de manera dinámica para usarlo en las notificaciones
      - name: Get Latest Tag
        id: tag_checker
        if: always()
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "No Tag")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      #Checkea linting, formato, tipos, test de componentes y cobertura de código
      - name: Type check
        run: pnpm type-check
      - name: Lint
        run: pnpm lint:ci
      - name: Format check
        run: pnpm format:check
      - name: Test & Coverage
        run: pnpm coverage
      
      #sube el artefacto del reporte de cobertura de test.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() # Asegura que el reporte se suba incluso si los tests fallan
        with:
          name: coverage-report
          path: frontend/coverage
          retention-days: 7
        
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      
      - name: Slack Success Notification
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: '✅ Job Success: Validate'
          SLACK_MESSAGE: 'Success Validate `${{ steps.tag_checker.outputs.version }}`'
  
      - name: Slack Failure Notification
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: '❌ Job Failed: Validate'
          SLACK_MESSAGE: 'El Job *Validate* ha fallado en el tag `${{ steps.tag_checker.outputs.version }}`.\n👉 Ver logs completos del fallo aquí: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
  #JOB - 2 -- BUILD
  #Valida que el dockerfile se construya correctamente
  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Get Latest Tag
        id: tag_checker
        if: always()
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "No Tag")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT        

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          #Verifica que el dockerfile se constuya correctamente, pero no sube la imagen a ningún registry.
          push: false
          #usa el cache de github actions para acelerar la construcción de la imagen.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Slack Success Notification
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: '✅ Job Success: Build'
          SLACK_MESSAGE: 'Success Build `${{ steps.tag_checker.outputs.version }}`'

      - name: Slack Failure Notification
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: '❌ Job Failed: Build'
          SLACK_MESSAGE: 'El Job *Build* ha fallado en el tag `${{ steps.tag_checker.outputs.version }}`.\n👉 Ver logs completos del fallo aquí: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
  
  publish:
    name: Publish to GHCR
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      

      - name: Set repository name to lowercase
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Get version from latest git tag
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "❌ No git tag found. Run: git flow release finish x.x.x && git push --follow-tags"
            exit 1
          fi
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Version detected: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log published image
        run: |
          echo "✅ Image published to GHCR"
          echo "   - ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}"
          echo "   - ghcr.io/${{ steps.repo.outputs.name }}:latest"
      - name: Slack Success Notification
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: '✅ Job Success: Publish'
          SLACK_MESSAGE: 'Success Publish `${{ steps.version.outputs.version }}`'

      - name: Slack Failure Notification
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: '❌ Job Failed: Publish'
          SLACK_MESSAGE: 'El Job *Publish* ha fallado en el tag `${{ steps.version.outputs.version }}`.\n👉 Ver logs completos del fallo aquí: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
  
  deploy:
    name: Deploy to Render
    needs: publish
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Validate Render webhook URL
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "❌ Error: RENDER_DEPLOY_HOOK_URL no está configurado en los secrets"
            exit 1
          fi
          echo "✅ Render webhook URL configured"
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger deployment on Render
        run: |
          echo "🚀 Triggering deployment on Render..."
          echo "   Version: ${{ needs.publish.outputs.version }}"
          echo "   Image: ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.version }}"
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
          echo ""
          echo "✅ Deployment triggered successfully"

      - name: Log deployment info
        run: |
          echo "📋 Deployment Info:"
          echo "  - Triggered by: ${{ github.actor }}"
          echo "  - Version: ${{ needs.publish.outputs.version }}"
          echo "  - Commit: ${{ github.sha }}"
          echo "  - Image: ghcr.io/${{ github.repository }}:${{ needs.publish.outputs.version }}"
          echo "  - Latest: ghcr.io/${{ github.repository }}:latest"
      
      - name: Slack Success Notification
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: '🚀 Job Success: Deploy'
          SLACK_MESSAGE: 'Success Deploy `${{ needs.publish.outputs.version }}` en Render'

      - name: Slack Failure Notification
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: '❌ Job Failed: Deploy'
          SLACK_MESSAGE: 'El Job *Deploy* ha fallado para la versión `${{ needs.publish.outputs.version }}`.\n👉 Ver logs completos del fallo aquí: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'