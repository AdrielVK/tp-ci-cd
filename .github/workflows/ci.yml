name: CI

on:
  push:
    branches:
      - master
      - develop
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — validate
  # Verifica tipos, lint, formato y tests con cobertura
  # Corre en TODAS las ramas y PRs
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint:ci

      - name: Format check
        run: pnpm format:check

      - name: Test & Coverage
        run: pnpm coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — build
  # Valida que el Dockerfile compila correctamente
  # Corre en todos los PRs y ramas principales
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: validate

    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para acceder a los tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — publish
  # Publica imagen a GHCR con versionado semántico automático
  #
  # Solo se ejecuta cuando hay PUSH a master (código productivo)
  # Lee automáticamente el último tag de Git para versionar la imagen
  #
  # Flujo Gitflow:
  #   git flow release finish 1.0.0
  #   git push origin master --follow-tags
  #
  # Resultado en GHCR:
  #   - ghcr.io/adrielvk/tp-ci-cd:1.0.0 (versión exacta)
  #   - ghcr.io/adrielvk/tp-ci-cd:latest (siempre apunta a lo más reciente)
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to GHCR
    needs: build
    runs-on: ubuntu-24.04
    
    # Solo publica cuando hay push a master (código productivo)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para acceder a los tags

      - name: Get version from latest git tag
        id: version
        run: |
          # Obtiene el último tag (ej: 1.0.0 o v1.0.0)
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          # Elimina el prefijo "v" si existe (v1.0.0 → 1.0.0)
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Version detected: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            git.version=${{ steps.version.outputs.version }}
            git.commit=${{ github.sha }}
            git.ref=${{ github.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log published image
        run: |
          echo "✅ Image published to GHCR"
          echo "   - ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
          echo "   - ghcr.io/${{ github.repository }}:latest"