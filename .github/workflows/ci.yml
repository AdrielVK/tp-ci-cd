name: CI

on:
  # El CI se ejecuta cuando se hace push/pull-request a las siguientes ramas:
  push:
    branches:
      - master
      - develop
      - "release/**"
      - "hotfix/**"
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - master
      - develop

# Cancela runs anteriores del mismo PR si se hace un nuevo push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — validate
  # Verifica tipos, lint, formato y tests con cobertura
  # Corre en TODAS las ramas y PRs
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      # Trae el código al runner
      - name: Checkout
        uses: actions/checkout@v4

      # Instala pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      # Instala Node 22 y activa el cache de pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Instala dependencias respetando el lockfile exacto
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Los siguientes pasos se podrían ejecutar con el script "validate" definido
      # en package.json, pero se separan para tener mejor feedback visual en GitHub

      # Verifica que no haya errores de tipos en TypeScript
      - name: Type check
        run: pnpm type-check

      # Verifica que no haya errores ni warnings de ESLint
      - name: Lint
        run: pnpm lint:ci

      # Verifica que todo el código cumpla el formato de Prettier
      - name: Format check
        run: pnpm format:check

      # Verifica que los tests se ejecuten correctamente y que la cobertura supere los umbrales
      - name: Test & Coverage
        run: pnpm coverage

      # Publica el reporte de cobertura como artefacto descargable
      # Disponible en la pestaña "Actions" del PR en GitHub
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — build
  # Verifica que el Dockerfile de producción se construye correctamente.
  # Incluye lint, type-check y build de Vite (definidos en el Dockerfile).
  #
  # Corre en:
  #   - TODOS los PRs (feature/* → develop, develop → release/*, release/* → master)
  #   - Push a master (código productivo)
  #   - Push a develop (rama de integración)
  #   - Push a release/* (release candidates)
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: validate

    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construye la imagen de producción completa
      # Si lint, tsc o vite build fallan dentro del Dockerfile, este step falla
      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  publish:
    name: Publish to GHCR
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
      
      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max